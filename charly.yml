defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
docs-site:
    candy:
        description: |-
            The Astro + Starlight toolchain for the opencharly.ai documentation site, plus a
            production build of the published site itself, built inside the box.

            This candy is what makes the docs site provable rather than merely deployable: it
            clones the opencharly/docs repository, runs a clean `npm ci` against its committed
            lockfile, and builds the production site into /srv/docs/dist. A build failure — a bad
            frontmatter scalar, a Starlight config a version bump invalidated, a page whose
            markdown will not parse — fails the IMAGE BUILD, which builds from the same input
            Cloudflare Pages does, so the box catches it before a deploy can.

            WHY IT CLONES the published repo rather than reading a local checkout: charly no
            longer carries the docs/ submodule (the docs de-submodule cutover made the docs repo
            standalone), and even with a checkout a candy's copy: source may not traverse above
            its own directory (`..` is rejected at validate time) — there is no schema field for
            pointing a candy at a sibling directory. Cloning the published repository is the
            schema-legal path, and it happens to test the more useful thing — the exact source
            Cloudflare builds. It fetches an IMMUTABLE COMMIT (`DOCS_REF` below), never a branch:
            that is what keeps the clone layer's cache key moving with the pin. The consequence is
            an ordering dependency — docs content must be merged, and `DOCS_REF` re-pinned to that
            merge, before this box (and the check-docs bed above it) prove the new content.

            The checks below assert the site's SHAPE, not merely its existence: a generated CLI
            page, a candy page carrying its published acceptance plan, a recipe card from the
            skill corpus with its cross-references rewritten into site links, and — the
            load-bearing one — the page of a plugin that is NOT compiled into the charly binary,
            rendering both its runtime placement and its CUE parameter schema. That last check is
            what fails if the generator ever narrows to documenting only the default-active set.
            The deliberately-last liberation easter-egg page is asserted too — the bed fails the
            moment that page stops shipping.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
        var:
            DOCS_REPO: https://github.com/opencharly/docs.git
            # An IMMUTABLE COMMIT, never a branch name. This is a cache-correctness requirement,
            # not a preference: `var:` values are emitted as ENV above the steps, so the clone
            # layer's cache key moves only when this string moves. With `main` here the key was
            # CONSTANT, so once the clone layer was cached the bed kept rebuilding whatever docs
            # `main` pointed at when that layer was first built — and went on reporting PASS while
            # proving stale content. It must equal the docs repo's current `main` head; `task
            # docs:pin` checks that (charly no longer carries a `docs` gitlink — the docs repo is
            # standalone since the de-submodule cutover), and the bed asserts it from inside the
            # built image.
            DOCS_REF: c5568310f0409676728f552712f0896359a789c5
        distro:
            fedora:
                package:
                    - git
        plan:
            - run: clone the published documentation site source at the pinned commit
              command: |
                rm -rf /srv/docs
                git init -q /srv/docs
                git -C /srv/docs remote add origin "${DOCS_REPO}"
                git -C /srv/docs fetch -q --depth 1 origin "${DOCS_REF}"
                git -C /srv/docs checkout -q FETCH_HEAD
                # Record what was ACTUALLY fetched, in the same layer as the fetch, so a stale
                # cached layer carries a stale sha. Written as a plain file rather than read back
                # with git at check time: the check runs as a different uid than this root step and
                # git refuses a repo it sees as foreign ("detected dubious ownership"), failing the
                # probe for a reason unrelated to the content.
                git -C /srv/docs rev-parse HEAD > /srv/docs/.charly-pinned-commit
              run_as: root

            - # Proves the layer that produced this image actually fetched the pinned commit.
              #
              # The sha is a LITERAL here, duplicating DOCS_REF above, because charly's check-step
              # substitution does not resolve a candy `var:` — it SKIPS the step with "unresolved
              # variables: DOCS_REF" instead, which would turn this guard into a non-event while
              # the bed still reported PASS. That is the same failure this check exists to catch,
              # so it must not depend on substitution. `task docs:pin` asserts BOTH occurrences
              # against the docs gitlink, so the duplication cannot drift unnoticed.
              #
              # This check is the reason the cache defect cannot recur silently: the first version
              # of this bed cloned with a constant `--branch main`, so podman's layer key never
              # moved when docs main advanced, and every run reported PASS while building
              # docs@7e82b67. A stale layer now FAILS here instead.
              check: the cloned site is the pinned commit, not a stale cached layer
              id: docs-site-pinned-commit
              exit_status: 0
              stdout:
                - contains: c5568310f0409676728f552712f0896359a789c5
              context:
                - build
                - runtime
              command: cat /srv/docs/.charly-pinned-commit

            - run: install the site's node dependencies from the committed lockfile
              command: |
                cd /srv/docs
                npm ci --no-audit --no-fund
              run_as: root
              cache:
                - /root/.npm

            - run: build the production site
              command: |
                cd /srv/docs
                npm run build
              run_as: root

            - check: node is installed and reports a parseable major version
              id: docs-site-node-present
              exit_status: 0
              stdout:
                - matches: "v[0-9]+\\."
              context:
                - build
                - runtime
              command: node --version

            - check: the production build produced the site entry point
              id: docs-site-index-built
              file:
                file: /srv/docs/dist/index.html
                exists: true
              context:
                - build
                - runtime

            - check: the built site carries a GENERATED CLI reference page (proves the cli tree was emitted and rendered)
              id: docs-site-cli-page
              exit_status: 0
              stdout:
                - contains: charly docs
              context:
                - build
                - runtime
              command: cat /srv/docs/dist/reference/cli/docs/index.html

            - # The page's DIRECTORY carries the corpus version the site projects from
              # (`<repo>-<name>-v<calver>/`), so a hard-coded directory would redden this
              # bed on the next corpus advance — a false alarm about a change that never
              # touched the site. The page is therefore resolved BY NAME and the newest
              # version is read; the assertion that matters (a generated candy page
              # publishes its Acceptance plan) is unchanged. The `test -n` is what makes
              # the check FAIL when the page is gone at all: a generator that narrowed to
              # documenting nothing would otherwise leave `cat` reading an empty path and
              # the check would pass on an empty stdout.
              check: a generated candy page publishes its plan as a runnable acceptance spec (the ADE surface a reader can see without cloning anything)
              id: docs-site-candy-acceptance-plan
              exit_status: 0
              stdout:
                - contains: Acceptance plan
              context:
                - build
                - runtime
              command: |
                page=$(find /srv/docs/dist/reference/candy -type f -path '*/charly/index.html' | sort -V | tail -n 1)
                test -n "$page" || { echo "no generated candy page for 'charly' under /srv/docs/dist/reference/candy" >&2; exit 1; }
                cat "$page"

            - check: a recipe card from the skill corpus rendered, with its harness cross-references rewritten into working site links
              id: docs-site-recipe-card
              exit_status: 0
              stdout:
                - contains: /recipes/internals/
              context:
                - build
                - runtime
              command: cat /srv/docs/dist/recipes/check/check/index.html

            - # THE load-bearing check. plugin-cdp is NOT in charly/charly.yml compiled_plugins — it
              # loads out-of-process over gRPC. If the generator ever narrows to the default-active set
              # (the charly binary's own command model, or the enabled-boxes list), this page disappears
              # and this step fails. It also asserts the rendered CUE schema, which is the only place a
              # reader can learn an out-of-process verb's parameter grammar.
              check: a RUNTIME (out-of-process) plugin's page renders both its placement and its CUE parameter schema — the assertion that fails if the generator ever documents only what is compiled in
              id: docs-site-runtime-plugin-page
              exit_status: 0
              stdout:
                - contains: out-of-process
                - contains: Parameter schema
              context:
                - build
                - runtime
              # plugin-cdp's page is CORPUS-projected, so its directory carries the corpus
              # version (`<repo>-<name>-v<calver>/`) and a hard-coded directory would
              # redden this bed on the next corpus advance — a false alarm about a change
              # that never touched the site. Resolved BY NAME, newest version read; the
              # `test -n` is what makes the check FAIL when the page is gone at all, which
              # is the case this check exists to catch: a generator that narrowed to the
              # default-active (compiled-in) plugin set would drop plugin-cdp entirely,
              # and `cat` of an empty path would pass on an empty stdout.
              command: |
                page=$(find /srv/docs/dist/reference/plugin -type f -path '*/plugin-cdp/index.html' | sort -V | tail -n 1)
                test -n "$page" || { echo "no plugin page for 'plugin-cdp' under /srv/docs/dist/reference/plugin" >&2; exit 1; }
                cat "$page"

            - check: the provider cross-index resolves every reserved word to its owning plugin
              id: docs-site-provider-index
              exit_status: 0
              stdout:
                - contains: Provider index
              context:
                - build
                - runtime
              command: cat /srv/docs/dist/reference/providers/index.html

            - check: the easter-egg liberation page rendered (fails without the page)
              id: docs-site-liberation-page
              exit_status: 0
              stdout:
                - contains: Liberation
              context:
                - build
                - runtime
              command: cat /srv/docs/dist/liberation/index.html

# =============================================================================
# docs-site-app + check-docs — the R10 bed for the docs-site candy. Moved here
# from opencharly/charly's charly.yml, which cannot exercise this candy as
# in-development code (the bed's dev-tree override resolves the bed project's
# own superproject, not the candy owner), so the artifact owner tests its own
# candy locally.
#
# The box composes the LOCAL `docs-site` candy above (no @github pin), so a
# bed run always tests this checkout. The distro tag chain is load-bearing, not
# decoration: the package resolver walks the IMAGE's declared chain
# most-specific-first, so a box that declares `base:` alone matches no
# per-distro section and silently installs nothing (the `git: command not
# found` failure the first bed run hit before the tags were added).
# =============================================================================
docs-site-app:
    candy:
        base: quay.io/fedora/fedora:43
        description: |-
            The documentation-site box: a minimal Fedora base composing the local
            docs-site candy, which clones the published docs repo, installs its node
            dependencies from the committed lockfile, and runs the production Astro
            build. The candy's checks run in BOTH contexts, so `charly check box
            docs-site-app` proves the site builds and has the right shape without
            deploying anything, and `charly check live` re-proves the same shape
            against the running pod — which is what makes the bed's fresh-rebuild leg
            assert the site rather than merely that the container is up.
        distro:
            - fedora:43
            - fedora
        candy:
            - docs-site
        # The box's OWN deterministic acceptance step (ADE). It asserts the box's
        # declared composition identity — the Fedora 43 base it was authored on — and
        # runs in BOTH contexts, so `charly check box docs-site-app` proves it without
        # deploying. Deliberately NOT a duplicate of the composed candy's site-shape
        # checks (R3): the candy proves the SITE; the box proves the BOX was built on
        # the base it declares (a silent base substitution — e.g. a tag roll that moved
        # fedora 43's content — would fail here while every candy check still passed).
        plan:
            - check: the docs-site-app box was built on the Fedora 43 base it declares
              id: docs-site-app-base-identity
              exit_status: 0
              stdout:
                - contains: ID=fedora
                - contains: VERSION_ID=43
              context:
                - build
                - runtime
              command: cat /etc/os-release
check-docs:
    pod:
        image: docs-site-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the opencharly.ai documentation site. Deploying it to steady state proves the docs-site-app box — whose image build ran `npm ci` + the production Astro build and asserted the built site's shape (a generated CLI page, a candy page carrying its published acceptance plan, a recipe card with rewritten cross-references, a RUNTIME out-of-process plugin's page with its CUE schema, and the provider cross-index) — builds, starts, and stays up. The generator's own cross-reference integrity gate (an unresolvable /charly-x:y reference fails generation) is covered by the plugin's Go tests; this bed covers the artifact those produce. Content staleness against the pinned charly is gated by the docs repo's own deploy workflow, not here.
        plan:
            - check: the docs-site pod reached steady state (the built site's box runs)
              id: docs-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-docs
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the built site is present in the running container, entry point included
              id: docs-pod-site-present
              exit_status: 0
              stdout:
                - contains: OpenCharly
              context:
                - runtime
              command: cat /srv/docs/dist/index.html

docs-site-skill:
    skill:
        name: docs-site
        family: tools
        owner: docs-site
        description: |-
            The Astro + Starlight toolchain candy for the opencharly.ai documentation site, and the
            check-docs R10 bed that builds and proves it.
            Use when working with the docs-site candy, the docs-site-app box, the check-docs bed, or when
            the documentation site fails to build.
        triggers:
            - "`charly docs` / the opencharly.ai site / the opencharly/docs repo / `candy/docs-site` / the check-docs bed / Starlight/Astro"
